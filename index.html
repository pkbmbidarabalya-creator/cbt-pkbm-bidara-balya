<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CBT Online - PKBM Bidara Balya</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .info {
      margin-top: 22px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .error {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 14px;
      text-align: center;
    }

    .dashboard {
      display: none;
    }

    .student-name {
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .student-info {
      text-align: center;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .exam-card {
      padding: 20px;
      background: #eff6ff;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .exam-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .exam-card p {
      color: #64748b;
      margin-bottom: 15px;
    }

    .logout {
      background: #e2e8f0;
      color: #334155;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginPage">

      <div class="logo">
        CBT
      </div>

      <h1>CBT Online</h1>

      <p class="subtitle">
        PKBM Bidara Balya<br>
        Sistem Ujian Online
      </p>

      <div class="error" id="errorMessage"></div>

      <form id="loginForm">

        <label for="nisn">NISN</label>

        <input
          type="text"
          id="nisn"
          placeholder="Masukkan NISN"
          maxlength="20"
          autocomplete="off"
          required
        >

        <button type="submit" id="loginButton">
          Masuk
        </button>

      </form>

      <div class="info">
        Gunakan NISN yang sudah terdaftar
        untuk mengikuti ujian.
      </div>

    </div>


    <!-- DASHBOARD -->
    <div class="card dashboard" id="dashboardPage">

      <div class="logo">
        CBT
      </div>

      <div class="student-name" id="studentName">
        Nama Siswa
      </div>

      <div class="student-info">
        <div id="studentNisn"></div>
        <div id="studentPaket"></div>
        <div id="studentKelas"></div>
      </div>

      <div class="exam-card">

        <h2>Matematika</h2>

        <p>
          Semester 1 • Hari 1<br>
          25 Soal • 45 Menit
        </p>

        <button onclick="mulaiUjian()">
          Mulai Ujian
        </button>

      </div>

      <button class="logout" onclick="logout()">
        Keluar
      </button>

    </div>

    <div class="footer">
      © 2026 PKBM Bidara Balya
    </div>

  </div>


  <script>

    // ================================
    // SUPABASE
    // ================================

    const SUPABASE_URL =
      "https://yrapraumxkcvkgxgphgt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Yp3c7QV9vhvNEhkOdwhpqw_bLW8JWqx";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ================================
    // LOGIN
    // ================================

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const nisn =
          document
            .getElementById("nisn")
            .value
            .trim();

        const button =
          document.getElementById("loginButton");

        const error =
          document.getElementById("errorMessage");

        error.style.display = "none";

        button.disabled = true;
        button.textContent = "Memeriksa...";

        try {

          const { data, error: rpcError } =
            await supabaseClient.rpc(
              "login_siswa",
              {
                p_nisn: nisn
              }
            );

          if (rpcError) {
            throw rpcError;
          }

          if (!data || data.length === 0) {

            error.textContent =
              "NISN tidak ditemukan. Periksa kembali NISN kamu.";

            error.style.display = "block";

            button.disabled = false;
            button.textContent = "Masuk";

            return;
          }

          const siswa = data[0];

          // Simpan data siswa sementara
          sessionStorage.setItem(
            "siswa",
            JSON.stringify(siswa)
          );

          // Tampilkan dashboard
          tampilkanDashboard(siswa);

        } catch (err) {

          console.error(err);

          error.textContent =
            "Terjadi kesalahan saat menghubungkan ke server.";

          error.style.display = "block";

          button.disabled = false;
          button.textContent = "Masuk";
        }

      });


    // ================================
    // DASHBOARD
    // ================================

    function tampilkanDashboard(siswa) {

      document
        .getElementById("loginPage")
        .style.display = "none";

      document
        .getElementById("dashboardPage")
        .style.display = "block";

      document
        .getElementById("studentName")
        .textContent = siswa.nama;

      document
        .getElementById("studentNisn")
        .textContent = "NISN: " + siswa.nisn;

      document
        .getElementById("studentPaket")
        .textContent = "Paket: " + siswa.paket;

      document
        .getElementById("studentKelas")
        .textContent = "Kelas: " + siswa.kelas;
    }


    // ================================
    // CEK LOGIN SEBELUMNYA
    // ================================

    const siswaTersimpan =
      sessionStorage.getItem("siswa");

    if (siswaTersimpan) {

      try {

        const siswa =
          JSON.parse(siswaTersimpan);

        tampilkanDashboard(siswa);

      } catch(e) {

        sessionStorage.removeItem("siswa");

      }
    }


    // ================================
    // MULAI UJIAN
    // ================================

    function mulaiUjian() {

      alert(
        "Login sudah berhasil!\n\n" +
        "Halaman soal akan kita buat pada langkah berikutnya."
      );

    }


    // ================================
    // LOGOUT
    // ================================

    function logout() {

      sessionStorage.removeItem("siswa");

      location.reload();

    }

  </script>

</body>
</html>
