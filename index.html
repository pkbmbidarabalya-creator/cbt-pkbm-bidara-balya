<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Ujian Online - PKBM Bidara Balya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #1e40af;       /* Blue 800 */
      --primary-hover: #1d4ed8; /* Blue 700 */
      --primary-light: #eff6ff; /* Blue 50 */
      --primary-border: #bfdbfe;/* Blue 200 */
      --text-main: #1e293b;
      --text-muted: #64748b;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding: 10px 0;
    }

    .header h2 {
      font-size: 1.5rem;
      color: var(--primary);
      font-weight: 700;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid #e2e8f0;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 16px;
    }

    label.form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      background-color: #fff;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15);
    }

    /* Option Item Styling (Custom Radio Buttons) */
    .opsi-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .opsi-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      background-color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    .opsi-label:hover {
      border-color: var(--primary-border);
      background-color: var(--primary-light);
    }

    .opsi-label input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #94a3b8;
      border-radius: 50%;
      margin-right: 12px;
      outline: none;
      flex-shrink: 0;
      transition: all 0.2s ease;
      position: relative;
    }

    .opsi-label input[type="radio"]:checked {
      border-color: var(--primary);
      background-color: var(--primary);
    }

    .opsi-label input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: white;
    }

    .opsi-label:has(input[type="radio"]:checked) {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 600;
      color: var(--primary);
    }

    /* Buttons */
    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Status & Alerts */
    #pesan {
      font-weight: 600;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
    }

    .info-bar {
      background-color: var(--primary);
      color: white;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    /* Responsif khusus layar kecil */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      .header h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>CBT Ujian Online</h2>
    <p>PKBM Bidara Balya</p>
  </div>
  
  <!-- Form Data Peserta & Pilih Paket -->
  <div class="card" id="form-peserta">
    <h3 style="margin-bottom: 16px; font-size: 1.1rem;">Data Peserta Ujian</h3>
    
    <div class="form-group">
      <label class="form-label" for="nama-siswa">Nama Lengkap</label>
      <input type="text" id="nama-siswa" placeholder="Masukkan nama Anda..." required>
    </div>
    
    <div class="form-group">
      <label class="form-label" for="pilih-paket">Pilih Paket Soal</label>
      <select id="pilih-paket">
        <option value="">-- Pilih Paket --</option>
        <option value="Paket A">Paket A</option>
        <option value="Paket B">Paket B</option>
        <option value="Paket C">Paket C</option>
      </select>
    </div>

    <button class="btn" onclick="mulaiUjian()">Mulai Ujian</button>
  </div>

  <!-- Wadah Soal Ujian -->
  <div id="area-ujian" style="display: none;">
    <div class="info-bar">
      <span id="judul-paket">Ujian</span>
      <span id="label-nama" style="font-size: 0.85rem; opacity: 0.9;"></span>
    </div>

    <form id="form-soal">
      <div id="wadah-soal"></div>
      <button type="button" class="btn" id="btn-submit" onclick="kirimJawaban()">Kirim Jawaban</button>
    </form>
  </div>

  <div id="pesan"></div>
</div>

<script>
const URL_GAS = "HTTPS_URL_GOOGLE_APPS_SCRIPT_ANDA";

let dataSoalAktif = [];
let namaPaketTerpilih = "";

async function mulaiUjian() {
  const namaSiswa = document.getElementById('nama-siswa').value.trim();
  namaPaketTerpilih = document.getElementById('pilih-paket').value;

  if (!namaSiswa || !namaPaketTerpilih) {
    tampilkanPesan("Harap isi nama dan pilih paket soal terlebih dahulu!", "red");
    return;
  }

  tampilkanPesan("Sedang mengambil soal...", "blue");
  
  const pathFolder = encodeURIComponent(namaPaketTerpilih);
  const urlFileJson = `./${pathFolder}/soal.json`;

  try {
    const response = await fetch(urlFileJson);
    if (!response.ok) throw new Error("File JSON tidak ditemukan di folder tersebut.");

    dataSoalAktif = await response.json();
    
    document.getElementById('form-peserta').style.display = 'none';
    document.getElementById('area-ujian').style.display = 'block';
    document.getElementById('judul-paket').innerText = `${namaPaketTerpilih}`;
    document.getElementById('label-nama').innerText = namaSiswa;
    
    hapusPesan();
    renderSoal(dataSoalAktif);

  } catch (error) {
    console.error(error);
    tampilkanPesan(`Gagal memuat soal: ${error.message}`, "red");
  }
}

function renderSoal(daftarSoal) {
  const wadah = document.getElementById('wadah-soal');
  wadah.innerHTML = "";

  daftarSoal.forEach((item, index) => {
    const cardSoal = document.createElement('div');
    cardSoal.className = 'card';

    let htmlOpsi = '';
    if (item.opsi) {
      htmlOpsi = '<div class="opsi-container">';
      Object.keys(item.opsi).forEach(kunci => {
        htmlOpsi += `
          <label class="opsi-label">
            <input type="radio" name="soal_${index}" value="${kunci}">
            <span><strong>${kunci}.</strong> ${item.opsi[kunci]}</span>
          </label>
        `;
      });
      htmlOpsi += '</div>';
    }

    cardSoal.innerHTML = `
      <p style="font-weight: 600; font-size: 1rem;">${index + 1}. ${item.pertanyaan || item.soal}</p>
      ${htmlOpsi}
    `;
    wadah.appendChild(cardSoal);
  });
}

async function kirimJawaban() {
  const namaSiswa = document.getElementById('nama-siswa').value;
  const btnSubmit = document.getElementById('btn-submit');

  let jawabanSiswa = {};
  dataSoalAktif.forEach((_, index) => {
    const terpilih = document.querySelector(`input[name="soal_${index}"]:checked`);
    jawabanSiswa[`Soal_${index + 1}`] = terpilih ? terpilih.value : "-";
  });

  const payload = {
    nama: namaSiswa,
    paket: namaPaketTerpilih,
    jawaban: jawabanSiswa,
    waktuSubmit: new Date().toLocaleString("id-ID")
  };

  btnSubmit.disabled = true;
  tampilkanPesan("Sedang mengirim jawaban...", "blue");

  try {
    await fetch(URL_GAS, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    tampilkanPesan("Jawaban berhasil dikirim! Terima kasih.", "green");
    document.getElementById('form-soal').style.display = 'none';

  } catch (error) {
    console.error(error);
    tampilkanPesan("Gagal mengirim jawaban. Periksa koneksi internet Anda.", "red");
    btnSubmit.disabled = false;
  }
}

function tampilkanPesan(teks, warna) {
  const pesan = document.getElementById('pesan');
  pesan.innerText = teks;
  pesan.style.display = "block";
  
  if (warna === "red") {
    pesan.style.backgroundColor = "#fef2f2";
    pesan.style.color = "#dc2626";
    pesan.style.border = "1px solid #fecaca";
  } else if (warna === "green") {
    pesan.style.backgroundColor = "#f0fdf4";
    pesan.style.color = "#16a34a";
    pesan.style.border = "1px solid #bbf7d0";
  } else {
    pesan.style.backgroundColor = "#eff6ff";
    pesan.style.color = "#1d4ed8";
    pesan.style.border = "1px solid #bfdbfe";
  }
}

function hapusPesan() {
  const pesan = document.getElementById('pesan');
  pesan.style.display = "none";
  pesan.innerText = "";
}
</script>



<script>


  // Fungsi utama untuk mengambil data soal dari folder Anda yang baru
  <script>
  // Variabel untuk menyimpan data soal yang aktif
  let semuaSoal = [];
  let indeksSoalAktif = 0;

  function muatSoalCBT(paket, kelas, namaFileJson) {
    const url = `${paket}/${kelas}/${namaFileJson}`;

    fetch(url)
      .then(response => {
        if (!response.ok) {
          throw new Error('Gagal memuat file soal dari jalur: ' + url);
        }
        return response.json();
      })
      .then(dataSoal => {
        console.log("Data CBT Berhasil Dimuat!", dataSoal);
        semuaSoal = dataSoal; // Menyimpan data json ke variabel global
        indeksSoalAktif = 0;   // Mulai dari soal pertama
        tampilkanSoalKeLayar(); // Panggil fungsi untuk menampilkan ke web
      })
      .catch(error => {
        console.error("Waduh, ada error saat ambil file:", error);
      });
  }

  // Fungsi otomatis untuk memunculkan teks soal dan pilihan ganda ke HTML
  function tampilkanSoalKeLayar() {
    // Pastikan ada data soal yang tersedia
    if (semuaSoal.length === 0) return;

    const dataAktif = semuaSoal[indeksSoalAktif];
    
    // Mencari atau membuat kotak container soal di HTML Anda
    let kotakSoal = document.getElementById('konten-soal-cbt');
    if (!kotakSoal) {
      // Jika belum ada kotaknya di bodi HTML, kita buatkan otomatis di atas script
      kotakSoal = document.createElement('div');
      kotakSoal.id = 'konten-soal-cbt';
      kotakSoal.style.padding = '20px';
      kotakSoal.style.maxWidth = '600px';
      kotakSoal.style.margin = '20px auto';
      kotakSoal.style.background = '#ffffff';
      kotakSoal.style.borderRadius = '8px';
      kotakSoal.style.boxShadow = '0 4px 6px rgba(0,0,0,0.1)';
      document.body.insertBefore(kotakSoal, document.body.lastElementChild.previousElementSibling);
    }

    // Menyusun elemen teks soal dan daftar pilihan ganda A, B, C, D
    let listPilihan = '';
    dataAktif.pilihan.forEach(pil => {
      listPilihan += `<p style="padding:10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:4px; cursor:pointer;">${pil}</p>`;
    });

    kotakSoal.innerHTML = `
      <h3 style="margin-bottom:10px; color:#1e40af;">Soal Nomor ${dataAktif.nomor}</h3>
      <p style="font-size:16px; margin-bottom:20px;">${dataAktif.soal}</p>
      <div>${listPilihan}</div>
    `;
  }

  // Menjalankan fungsi panggil data
  muatSoalCBT('paket_a', 'kelas_v/Semester 1/Hari 1', 'soal_agama_kelas_v_semester1.json');
</script>

;
</script>
</body>
</html>
