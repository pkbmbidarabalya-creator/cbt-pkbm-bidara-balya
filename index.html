<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT Ujian Online - PKBM Bidara Balya</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    .btn { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    .btn:disabled { background-color: #cccccc; }
    .opsi-label { display: block; margin: 8px 0; cursor: pointer; }
    #pesan { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>CBT Ujian Online</h2>
  
  <!-- Form Data Peserta & Pilih Paket -->
  <div class="card" id="form-peserta">
    <h3>Data Peserta Ujian</h3>
    <label>Nama Lengkap:</label><br>
    <input type="text" id="nama-siswa" style="width: 100%; padding: 8px; margin-bottom: 10px;" required><br>
    
    <label>Pilih Paket Soal:</label><br>
    <select id="pilih-paket" style="width: 100%; padding: 8px; margin-bottom: 15px;">
      <option value="">-- Pilih Paket --</option>
      <option value="Paket A">Paket A</option>
      <option value="Paket B">Paket B</option>
      <option value="Paket C">Paket C</option>
    </select><br>

    <button class="btn" onclick="mulaiUjian()">Mulai Ujian</button>
  </div>

  <!-- Wadah Soal Ujian -->
  <div id="area-ujian" style="display: none;">
    <h3 id="judul-paket"></h3>
    <form id="form-soal">
      <div id="wadah-soal"></div>
      <button type="button" class="btn" id="btn-submit" onclick="kirimJawaban()">Kirim Jawaban</button>
    </form>
  </div>

  <div id="pesan"></div>
</div>

<script>
// URL Web App Google Apps Script Anda (Ganti dengan URL milik Anda)
const URL_GAS = "HTTPS_URL_GOOGLE_APPS_SCRIPT_ANDA";

let dataSoalAktif = [];
let namaPaketTerpilih = "";

// 1. Memuat Soal berdasarkan Paket yang dipilih
async function mulaiUjian() {
  const namaSiswa = document.getElementById('nama-siswa').value.trim();
  namaPaketTerpilih = document.getElementById('pilih-paket').value;

  if (!namaSiswa || !namaPaketTerpilih) {
    alert("Harap isi nama dan pilih paket soal terlebih dahulu!");
    return;
  }

  const pesan = document.getElementById('pesan');
  pesan.innerText = "Sedang mengambil soal...";
  
  // Menangani nama folder dengan spasi (misal: Paket A -> Paket%20A)
  const pathFolder = encodeURIComponent(namaPaketTerpilih);
  
  /* Catatan: Sesuaikan nama file JSON (misal: 'soal.json') 
     dengan nama file asli di dalam folder Paket A/B/C di GitHub */
  const urlFileJson = `./${pathFolder}/soal.json`;

  try {
    const response = await fetch(urlFileJson);
    if (!response.ok) throw new Error("File JSON tidak ditemukan di folder tersebut.");

    dataSoalAktif = await response.json();
    
    // Tampilkan lembar ujian
    document.getElementById('form-peserta').style.display = 'none';
    document.getElementById('area-ujian').style.display = 'block';
    document.getElementById('judul-paket').innerText = `Ujian: ${namaPaketTerpilih}`;
    pesan.innerText = "";
    
    renderSoal(dataSoalAktif);

  } catch (error) {
    console.error(error);
    pesan.style.color = "red";
    pesan.innerText = `Gagal memuat soal: ${error.message}`;
  }
}

// 2. Menampilkan daftar soal ke HTML
function renderSoal(daftarSoal) {
  const wadah = document.getElementById('wadah-soal');
  wadah.innerHTML = "";

  daftarSoal.forEach((item, index) => {
    const cardSoal = document.createElement('div');
    cardSoal.className = 'card';

    let htmlOpsi = '';
    if (item.opsi) {
      Object.keys(item.opsi).forEach(kunci => {
        htmlOpsi += `
          <label class="opsi-label">
            <input type="radio" name="soal_${index}" value="${kunci}">
            ${kunci}. ${item.opsi[kunci]}
          </label>
        `;
      });
    }

    cardSoal.innerHTML = `
      <p><strong>${index + 1}. ${item.pertanyaan || item.soal}</strong></p>
      ${htmlOpsi}
    `;
    wadah.appendChild(cardSoal);
  });
}

// 3. Pengiriman Jawaban ke Google Sheets via Google Apps Script
async function kirimJawaban() {
  const namaSiswa = document.getElementById('nama-siswa').value;
  const btnSubmit = document.getElementById('btn-submit');
  const pesan = document.getElementById('pesan');

  // Kumpulkan semua jawaban peserta
  let jawabanSiswa = {};
  dataSoalAktif.forEach((_, index) => {
    const terpilih = document.querySelector(`input[name="soal_${index}"]:checked`);
    jawabanSiswa[`Soal_${index + 1}`] = terpilih ? terpilih.value : "-";
  });

  const payload = {
    nama: namaSiswa,
    paket: namaPaketTerpilih,
    jawaban: jawabanSiswa,
    waktuSubmit: new Date().toLocaleString("id-ID")
  };

  btnSubmit.disabled = true;
  pesan.style.color = "black";
  pesan.innerText = "Sedang mengirim jawaban...";

  try {
    const response = await fetch(URL_GAS, {
      method: "POST",
      mode: "no-cors", // Digunakan agar tidak terhalang CORS Google Sheets
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    pesan.style.color = "green";
    pesan.innerText = "Jawaban berhasil dikirim! Terima kasih.";
    document.getElementById('form-soal').style.display = 'none';

  } catch (error) {
    console.error(error);
    pesan.style.color = "red";
    pesan.innerText = "Gagal mengirim jawaban. Periksa koneksi internet Anda.";
    btnSubmit.disabled = false;
  }
}
</script>

</body>
</html>
