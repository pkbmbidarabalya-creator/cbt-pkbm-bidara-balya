<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CBT Online - PKBM Bidara Balya</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f8fbff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .info {
      margin-top: 22px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      color: #475569;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .error {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #fef2f2;
      color: #dc2626;
      font-size: 14px;
      text-align: center;
    }

    .dashboard {
      display: none;
    }

    .student-name {
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .student-info {
      text-align: center;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .exam-card {
      padding: 20px;
      background: #eff6ff;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .exam-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .exam-card p {
      color: #64748b;
      margin-bottom: 15px;
    }

    .logout {
      background: #e2e8f0;
      color: #334155;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <div class="card" id="loginPage">

      <div class="logo">
        CBT
      </div>

      <h1>CBT Online</h1>

      <p class="subtitle">
        PKBM Bidara Balya<br>
        Sistem Ujian Online
      </p>

      <div class="error" id="errorMessage"></div>

      <form id="loginForm">

        <label for="nisn">NISN</label>

        <input
          type="text"
          id="nisn"
          placeholder="Masukkan NISN"
          maxlength="20"
          autocomplete="off"
          required
        >

        <button type="submit" id="loginButton">
          Masuk
        </button>

      </form>

      <div class="info">
        Gunakan NISN yang sudah terdaftar
        untuk mengikuti ujian.
      </div>

    </div>


    <!-- DASHBOARD -->
    <div class="card dashboard" id="dashboardPage">

      <div class="logo">
        CBT
      </div>

      <div class="student-name" id="studentName">
        Nama Siswa
      </div>

      <div class="student-info">
        <div id="studentNisn"></div>
        <div id="studentPaket"></div>
        <div id="studentKelas"></div>
      </div>

      <div class="exam-card">

        <h2>Matematika</h2>

        <p>
          Semester 1 • Hari 1<br>
          25 Soal • 45 Menit
        </p>

        <button onclick="mulaiUjian()">
          Mulai Ujian
        </button>

      </div>

      <button class="logout" onclick="logout()">
        Keluar
      </button>

    </div>

    <div class="footer">
      © 2026 PKBM Bidara Balya
    </div>

  </div>


  <script>

    // ================================
    // SUPABASE
    // ================================

    const SUPABASE_URL =
      "https://yrapraumxkcvkgxgphgt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Yp3c7QV9vhvNEhkOdwhpqw_bLW8JWqx";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ================================
    // LOGIN
    // ================================

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const nisn =
          document
            .getElementById("nisn")
            .value
            .trim();

        const button =
          document.getElementById("loginButton");

        const error =
          document.getElementById("errorMessage");

        error.style.display = "none";

        button.disabled = true;
        button.textContent = "Memeriksa...";

        try {

          const { data, error: rpcError } =
            await supabaseClient.rpc(
              "login_siswa",
              {
                p_nisn: nisn
              }
            );

          if (rpcError) {
            throw rpcError;
          }

          if (!data || data.length === 0) {

            error.textContent =
              "NISN tidak ditemukan. Periksa kembali NISN kamu.";

            error.style.display = "block";

            button.disabled = false;
            button.textContent = "Masuk";

            return;
          }

          const siswa = data[0];

          // Simpan data siswa sementara
          sessionStorage.setItem(
            "siswa",
            JSON.stringify(siswa)
          );

          // Tampilkan dashboard
          tampilkanDashboard(siswa);

        } catch (err) {

          console.error(err);

          error.textContent =
            "Terjadi kesalahan saat menghubungkan ke server.";

          error.style.display = "block";

          button.disabled = false;
          button.textContent = "Masuk";
        }

      });


    // ================================
    // DASHBOARD
    // ================================

    function tampilkanDashboard(siswa) {

      document
        .getElementById("loginPage")
        .style.display = "none";

      document
        .getElementById("dashboardPage")
        .style.display = "block";

      document
        .getElementById("studentName")
        .textContent = siswa.nama;

      document
        .getElementById("studentNisn")
        .textContent = "NISN: " + siswa.nisn;

      document
        .getElementById("studentPaket")
        .textContent = "Paket: " + siswa.paket;

      document
        .getElementById("studentKelas")
        .textContent = "Kelas: " + siswa.kelas;
    }


    // ================================
    // CEK LOGIN SEBELUMNYA
    // ================================

    const siswaTersimpan =
      sessionStorage.getItem("siswa");

    if (siswaTersimpan) {

      try {

        const siswa =
          JSON.parse(siswaTersimpan);

        tampilkanDashboard(siswa);

      } catch(e) {

        sessionStorage.removeItem("siswa");

      }
    }


    // ================================
    // MULAI UJIAN
    // ================================

    async function mulaiUjian() {

    // Ujian Matematika Paket B Kelas VIII
    // Semester 1 - Hari 1
    const ujianId = 1;

    try {

        // Ambil soal dari Supabase
        const { data: soal, error } =
            await supabaseClient.rpc(
                "ambil_soal_ujian",
                {
                    p_ujian_id: ujianId
                }
            );

        if (error) {
            console.error(error);
            alert("Gagal mengambil soal: " + error.message);
            return;
        }

        if (!soal || soal.length === 0) {
            alert("Soal ujian belum tersedia.");
            return;
        }

        // Simpan soal sementara
        window.soalUjian = soal;
        window.nomorSoal = 0;
        window.jawabanSiswa = {};

        tampilkanSoal();

    } catch (error) {

        console.error(error);
        alert("Terjadi kesalahan saat membuka ujian.");

    }
}

    // =====================================
// TAMPILKAN SOAL UJIAN
// =====================================

function tampilkanSoal() {

    const soal = window.soalUjian[window.nomorSoal];

    if (!soal) {
        alert("Soal tidak ditemukan.");
        return;
    }

    const nomor = window.nomorSoal + 1;
    const total = window.soalUjian.length;

    let pilihanHTML = "";

    soal.pilihan.forEach(function(pilihan, index) {

        const huruf = String.fromCharCode(65 + index);

        // Ambil teks pilihan setelah "A. "
        const teksPilihan = pilihan.replace(/^[A-D]\.\s*/, "");

        const sudahDipilih =
            window.jawabanSiswa[soal.id] === huruf;

        pilihanHTML += `
            <button
                onclick="pilihJawaban('${huruf}')"
                style="
                    width:100%;
                    text-align:left;
                    padding:16px;
                    margin:8px 0;
                    border-radius:12px;
                    border:2px solid ${sudahDipilih ? '#2563eb' : '#e5e7eb'};
                    background:${sudahDipilih ? '#dbeafe' : 'white'};
                    cursor:pointer;
                    font-size:16px;
                    color:#333;
                "
            >
                <strong>${huruf}.</strong>
                ${teksPilihan}
            </button>
        `;
    });

    let navigasiHTML = "";

    for (let i = 0; i < total; i++) {

        const sudahDijawab =
            window.jawabanSiswa[window.soalUjian[i].id] !== undefined;

        const aktif = i === window.nomorSoal && !sudahDijawab;

        navigasiHTML += `
            <button
                onclick="keSoal(${i})"
                style="
                    width:38px;
                    height:38px;
                    margin:4px;
                    border-radius:50%;
                    border:none;
                    cursor:pointer;
                    font-weight:bold;
                    display:inline-flex;
                    align-items:center;
                    justify-content:center;
                    padding:0;
                    line-height:1;
                    color:${aktif || sudahDijawab ? 'white' : '#333'};
                    background:${
                        aktif
                        ? '#2563eb'
                        : sudahDijawab
                            ? '#16a34a'
                            : '#ef4444'
                    };
                "
            >
                ${i + 1}
            </button>
        `;
    }

    document.body.innerHTML = `

        <div style="
            min-height:100vh;
            background:#f3f6fb;
            font-family:Arial,sans-serif;
            padding:20px;
        ">

            <div style="
                max-width:800px;
                margin:auto;
            ">

                <!-- HEADER -->

                <div style="
                    background:white;
                    padding:18px;
                    border-radius:16px;
                    margin-bottom:16px;
                    box-shadow:0 3px 12px rgba(0,0,0,.08);
                ">

                    <div style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                    ">

                        <div>
                            <strong>MATEMATIKA</strong>
                            <div style="color:#666;margin-top:5px;">
                                Paket B • Kelas VIII
                            </div>
                        </div>

                        <div style="
                            background:#fee2e2;
                            color:#dc2626;
                            padding:10px 15px;
                            border-radius:10px;
                            font-weight:bold;
                        ">
                            ⏱ <span id="timer">45:00</span>
                        </div>

                    </div>

                </div>


                <!-- SOAL -->

                <div style="
                    background:white;
                    padding:24px;
                    border-radius:16px;
                    box-shadow:0 3px 12px rgba(0,0,0,.08);
                ">

                    <div style="
                        display:inline-block;
                        background:#2563eb;
                        color:white;
                        padding:7px 14px;
                        border-radius:20px;
                        font-weight:bold;
                        margin-bottom:18px;
                    ">
                        SOAL ${nomor} DARI ${total}
                    </div>

                    <div style="
                        font-size:19px;
                        line-height:1.6;
                        margin-bottom:20px;
                        white-space:pre-line;
                    ">
                        ${soal.soal}
                    </div>

                    ${soal.gambar ? `
                        <img
                            src="${soal.gambar}"
                            style="
                                max-width:100%;
                                border-radius:12px;
                                margin-bottom:15px;
                            "
                        >
                    ` : ""}

                    <div>
                        ${pilihanHTML}
                    </div>

                </div>


                <!-- NAVIGASI SOAL -->

                <div style="
                    background:white;
                    margin-top:16px;
                    padding:18px;
                    border-radius:16px;
                    text-align:center;
                    box-shadow:0 3px 12px rgba(0,0,0,.08);
                ">

                    <div style="
                        font-weight:bold;
                        margin-bottom:10px;
                    ">
                        Navigasi Soal
                    </div>

                    <div style="
                        display:flex;
                        flex-wrap:wrap;
                        justify-content:center;
                        align-items:center;
                     ">
                        ${navigasiHTML}
                    </div>

                </div>


                <!-- TOMBOL -->

                <div style="
                    display:flex;
                    justify-content:space-between;
                    gap:10px;
                    margin-top:16px;
                ">

                    <button
                        onclick="soalSebelumnya()"
                        style="
                            flex:1;
                            padding:15px;
                            border:none;
                            border-radius:12px;
                            background:#e5e7eb;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >
                        ← Kembali
                    </button>

                    <button
                        onclick="soalBerikutnya()"
                        style="
                            flex:1;
                            padding:15px;
                            border:none;
                            border-radius:12px;
                            background:#2563eb;
                            color:white;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >
                        Lanjut →
                    </button>

                </div>
<div style="
    margin-top:15px;
    text-align:center;
">
    <button
        onclick="selesaiUjian()"
        style="
            width:100%;
            padding:15px;
            border:none;
            border-radius:12px;
            background:#16a34a;
            color:white;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
        "
    >
        ✓ SELESAI UJIAN
    </button>
</div>
            </div>

        </div>
    `;

    mulaiTimer();
}


// =====================================
// PILIH JAWABAN
// =====================================

function pilihJawaban(huruf) {

    const soal = window.soalUjian[window.nomorSoal];

    window.jawabanSiswa[soal.id] = huruf;

    tampilkanSoal();
}


// =====================================
// PINDAH KE NOMOR SOAL
// =====================================

function keSoal(index) {

    if (
        index < 0 ||
        index >= window.soalUjian.length
    ) {
        return;
    }

    window.nomorSoal = index;

    tampilkanSoal();
}


// =====================================
// SOAL SEBELUMNYA
// =====================================

function soalSebelumnya() {

    if (window.nomorSoal > 0) {

        window.nomorSoal--;

        tampilkanSoal();
    }
}


// =====================================
// SOAL BERIKUTNYA
// =====================================

function soalBerikutnya() {

    if (
        window.nomorSoal <
        window.soalUjian.length - 1
    ) {

        window.nomorSoal++;

        tampilkanSoal();

    } else {

        alert(
            "Ini adalah soal terakhir. " +
            "Fitur selesai ujian akan kita buat berikutnya."
        );
    }
}


// =====================================
// TIMER
// =====================================

function selesaiUjian() {

    const yakin = confirm(
        "Apakah Anda yakin ingin menyelesaikan ujian?"
    );

    if (!yakin) {
        return;
    }

    // Hentikan timer
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    // Ambil data soal
    const soalUjian = window.soalUjian || [];
    const jawabanSiswa = window.jawabanSiswa || {};

    const total = soalUjian.length;

    // Hitung jawaban
    let dijawab = 0;
    let benar = 0;

    soalUjian.forEach(function(soal) {

        const jawaban = jawabanSiswa[soal.id];

        // Jika sudah dijawab
        if (jawaban) {
            dijawab++;

            // Ambil jawaban benar
            const jawabanBenar = String(
                soal.jawaban_benar || ""
            ).trim().toUpperCase();

            const jawabanUser = String(
                jawaban
            ).trim().toUpperCase();

            // Cocokkan jawaban
            if (jawabanUser === jawabanBenar) {
                benar++;
            }
        }
    });

    // Hitung salah dan kosong
    const salah = dijawab - benar;
    const kosong = total - dijawab;

    // Hitung nilai
    const nilai = total > 0
        ? Math.round((benar / total) * 100)
        : 0;

    // Tampilkan hasil
    alert(
        "UJIAN SELESAI\n\n" +
        "Total soal : " + total + "\n" +
        "Dijawab    : " + dijawab + "\n" +
        "Benar      : " + benar + "\n" +
        "Salah      : " + salah + "\n" +
        "Kosong     : " + kosong + "\n\n" +
        "NILAI : " + nilai
    );
}
    let timerInterval = null;
let waktuTersisa = 45 * 60;

function mulaiTimer() {

    if (timerInterval) {
        return;
    }

    timerInterval = setInterval(function() {

        const menit = Math.floor(waktuTersisa / 60);
        const detik = waktuTersisa % 60;

        const timer = document.getElementById("timer");

        if (timer) {
            timer.textContent =
                String(menit).padStart(2, "0") +
                ":" +
                String(detik).padStart(2, "0");
        }

        waktuTersisa--;

        if (waktuTersisa <= 0) {

            clearInterval(timerInterval);
            timerInterval = null;

            alert("Waktu ujian telah habis.");

        }

    }, 1000);
}

   
  </script>

</body>
</html>
